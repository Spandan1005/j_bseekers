[packageSubmit]
;BROKER_PORT = 5672
EXCHANGE = deployExchange
QUEUE = packageSubmit
ROUTING_KEY = "package.submit"

[packageDeploy]
;BROKER_PORT = 5672
EXCHANGE = deployExchange
QUEUE = packageDeploy
ROUTING_KEY = "package.deploy"

[frontendDeploy]
; this and the next one are for distribution within a cluster
; Spandan needs to make the queues and exchanges for this
EXCHANGE = deployExchange
QUEUE = frontendDeploy
ROUTING_KEY = "deploy.frontend"

[dmzDeploy]
EXCHANGE = deployExchange
QUEUE = dmzDeploy
ROUTING_KEY = "deploy.dmz"
